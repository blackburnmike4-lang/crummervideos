<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YouTube Fullscreen Embed</title>

<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

html,
body {
width: 100%;
height: 100%;
overflow: hidden;
background: #000;
}

.video-container {
width: 100vw;
height: 100vh;
}

iframe {
width: 100%;
height: 100%;
border: none;
}
</style>
</head>
<body>

<div class="video-container">
<iframe
src="https://www.youtube.com/embed/iEpJwprxDdk"
title="YouTube video player"
allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
allowfullscreen>
</iframe>
</div>

</body>
</html>
